services:
  redis:
    image: redis:8.10
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:3.8
    container_name: redisinsight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - 5540:5540
    volumes:
      - redisinsight-data:/db

volumes:
  redis-data:
  redisinsight-data:
