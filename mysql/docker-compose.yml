services:
  db:
    image: mysql:9.7
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chaiDB
      MYSQL_USER: chaiaurcode
      MYSQL_PASSWORD: chaiaurcode

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:6
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080

volumes:
  mysql-data:
