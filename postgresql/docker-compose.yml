services:
  db:
    image: postgres:18
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 5432:5432

    environment:
      - POSTGRES_DB=chaiDB
      - POSTGRES_USER=chaiaurcode
      - POSTGRES_PASSWORD=chaiaurcode

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaiaurcode"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:6
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080

volumes:
  postgres-data:
